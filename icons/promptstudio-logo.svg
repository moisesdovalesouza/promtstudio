<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Varinha mágica PromptStudio">
<defs>
  <linearGradient id="wand" x1="105" y1="420" x2="352" y2="165" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#25135f"/>
    <stop offset=".18" stop-color="#4420c6"/>
    <stop offset=".43" stop-color="#8e27e9"/>
    <stop offset=".68" stop-color="#ed2f98"/>
    <stop offset=".86" stop-color="#ff7138"/>
    <stop offset="1" stop-color="#ffc64d"/>
  </linearGradient>
  <linearGradient id="edge" x1="110" y1="420" x2="375" y2="120" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#6ec6ff"/>
    <stop offset=".25" stop-color="#8a6cff"/>
    <stop offset=".52" stop-color="#ff67c3"/>
    <stop offset=".76" stop-color="#ff9a42"/>
    <stop offset="1" stop-color="#fff08c"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff5ad"/>
    <stop offset=".3" stop-color="#ffd55f"/>
    <stop offset=".62" stop-color="#ff9b32"/>
    <stop offset="1" stop-color="#d85c22"/>
  </linearGradient>
  <radialGradient id="starFill">
    <stop offset="0" stop-color="#fffef0"/>
    <stop offset=".24" stop-color="#fff4a2"/>
    <stop offset=".52" stop-color="#ffc94d"/>
    <stop offset=".78" stop-color="#ff6f45"/>
    <stop offset="1" stop-color="#b92bd8"/>
  </radialGradient>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<!-- transparent background by design -->
<g opacity=".58" filter="url(#soft)">
  <circle cx="358" cy="149" r="102" fill="#ff6d62" opacity=".20"/>
  <circle cx="350" cy="144" r="86" fill="#b63cff" opacity=".15"/>
</g>
